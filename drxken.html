<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drxken | Links</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- VOLTANDO PARA A ESTÉTICA ANTERIOR --- */
        :root {
            --cor-fundo: #000000;       /* Preto Absoluto */
            --cor-card: #0a0a0a;        /* Quase preto para os botões */
            --cor-texto: #ffffff;
            --cor-destaque: #a020f0;    /* O Roxo forte que você escolheu */
            --cor-borda: #4b0082;       /* Roxo Índigo para bordas */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--cor-fundo);
            color: var(--cor-texto);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            min-height: 100vh;
        }

        /* Foto de Perfil com brilho neon */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cor-destaque);
            margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(160, 32, 240, 0.6);
        }

        h1 { 
            font-size: 1.8rem; 
            margin-bottom: 5px; 
            letter-spacing: -1px; 
            text-shadow: 2px 2px 10px rgba(160, 32, 240, 0.5);
        }

        .bio { font-size: 0.95rem; color: #888; margin-bottom: 35px; text-align: center; }

        /* Container de Links */
        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .link-card {
            background-color: var(--cor-card);
            border: 2px solid var(--cor-borda); 
            color: var(--cor-texto);
            padding: 18px;
            text-align: center;
            text-decoration: none;
            border-radius: 12px; /* Arredondado como antes */
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        /* Efeito de passar o mouse */
        .link-card:hover {
            background-color: var(--cor-destaque);
            border-color: var(--cor-destaque);
            color: #000; 
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.4);
        }

        i { font-size: 1.3rem; }
    </style>
</head>
<body oncontextmenu="return false;">

    <img src="https://i.ibb.co/7dw4kVdY/seu-arquivo.jpg" alt="Drxken" class="profile-pic">
    
    <h1>Drxken</h1>
    <p class="bio">Rapper / BeatMaker</p>

    <div class="links-container">
        
        <a href="https://youtube.com/@realdrakentk" class="link-card" target="_blank">
            <i class="fa-brands fa-youtube"></i> Meu Canal no YouTube
        </a>

        <a href="https://tiktok.com/@realdrakentk" class="link-card" target="_blank">
            <i class="fa-brands fa-tiktok"></i> TikTok
        </a>

        <a href="https://instagram.com/realdrakentk" class="link-card" target="_blank">
            <i class="fa-brands fa-instagram"></i> Instagram
        </a>

        <a href="https://open.spotify.com/artist/seu-id" class="link-card" target="_blank">
            <i class="fa-brands fa-spotify"></i> Meu Spotify
        </a>

        <a href="https://www.twitch.tv/realdrakentk" class="link-card" target="_blank">
            <i class="fa-brands fa-twitch"></i> Minha Twitch
        </a>

        <a href="https://livepix.gg/realdrakentk" class="link-card" target="_blank">
            <i class="fa-solid fa-coins"></i> Meu LivePix
        </a>

    </div>

    <script>
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        };
    </script>

</body>
</html>
